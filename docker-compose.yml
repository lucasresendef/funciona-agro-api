name: funciona-agro

services:
  funciona-agro-api-postgres:
    image: postgres:16-alpine
    container_name: funciona-agro-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funciona_agro_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5544:5432'
    volumes:
      - funciona-agro-api-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d funciona_agro_api']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  funciona-agro-api-keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: funciona-agro-api-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://funciona-agro-api-postgres:5432/funciona_agro_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    command: ['start-dev', '--http-port=8080', '--import-realm']
    depends_on:
      funciona-agro-api-postgres:
        condition: service_healthy
    ports:
      - '8181:8080'
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro

  funciona-agro-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funciona-agro-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3099
      DATABASE_URL: postgresql://postgres:postgres@funciona-agro-api-postgres:5432/funciona_agro_api?schema=public
      KEYCLOAK_PUBLIC_KEY: REPLACE_WITH_REALM_PUBLIC_KEY
      KEYCLOAK_URL: http://funciona-agro-api-keycloak:8080
      KEYCLOAK_REALM: funciona-agro
      KEYCLOAK_CLIENT_ID: funciona-agro-api
    depends_on:
      funciona-agro-api-postgres:
        condition: service_healthy
    ports:
      - '3099:3099'

volumes:
  funciona-agro-api-postgres-data:
